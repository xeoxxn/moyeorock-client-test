<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: 페이지를 노치·홈 인디케이터 밑까지 펼친다. 이게 없으면 브라우저가
         알아서 안전 영역 안으로 잘라 넣고, 그 대신 env(safe-area-inset-*)이 항상 0이 된다.
         펼친 만큼 피하는 건 우리 책임이 되며 index.css의 safe-area 유틸이 담당한다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>moyeorock</title>
    <!-- 모여락은 다크(네온) 테마 전용 앱이라 라이트 모드가 없다. WDS ThemeProvider(next-themes 기반)는
         명시적으로 저장된 테마가 없으면 OS 설정(prefers-color-scheme)을 따라가므로, 리액트가
         마운트되기 전에 theme을 "dark"로 고정해 둬야 라이트 OS에서도 깜빡임 없이 항상 다크로 뜬다. -->
    <script>
      try {
        localStorage.setItem("theme", "dark");
      } catch {}
      document.documentElement.dataset.theme = "dark";
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
