<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 앱 아이콘: 주홍(#C64537) 바탕 + 검은 피크(크게) + 아래쪽 작은 moyeorock 글자. 원본은 Figma "Brand — 앱 아이콘"(574:23689).
         홈 화면용 PNG는 모서리를 OS가 깎으니 꽉 찬 정사각형으로 두고, 피크와 글자 모두 마스커블 안전 영역(지름 80%) 안에 있다.
         브라우저 탭 파비콘은 글자가 안 읽히는 크기라 피크 심볼만 쓴다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열린다. 상태 표시줄은 투명하게 두고
         viewport-fit=cover + safe-area 유틸로 노치를 피한다. -->
    <meta name="apple-mobile-web-app-title" content="모여락" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- viewport-fit=cover: 페이지를 노치·홈 인디케이터 밑까지 펼친다. 이게 없으면 브라우저가
         알아서 안전 영역 안으로 잘라 넣고, 그 대신 env(safe-area-inset-*)이 항상 0이 된다.
         펼친 만큼 피하는 건 우리 책임이 되며 index.css의 safe-area 유틸이 담당한다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>moyeorock</title>
    <meta name="theme-color" content="#101012" />
    <!-- 모여락은 다크 테마 전용 앱이라 라이트 모드가 없다. WDS ThemeProvider(next-themes 기반)는
         명시적으로 저장된 테마가 없으면 OS 설정(prefers-color-scheme)을 따라가므로, 리액트가
         마운트되기 전에 theme을 "dark"로 고정해 둬야 라이트 OS에서도 깜빡임 없이 항상 다크로 뜬다. -->
    <script>
      try {
        localStorage.setItem("theme", "dark");
      } catch {}
      document.documentElement.dataset.theme = "dark";
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <!-- Archivo Black — 숫자(시간·날짜·통계)·커버 파트 글자용 브랜드 글꼴(Figma Foundation "Number") -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
